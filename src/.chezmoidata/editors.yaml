editors:
  vscode_compatible:
    shared:
      extensions:
        - bierner.markdown-mermaid
        - biomejs.biome
        - bpruitt-goddard.mermaid-markdown-syntax-highlighting
        - bradlc.vscode-tailwindcss
        - cardinal90.multi-cursor-case-preserve
        - charliermarsh.ruff
        - christian-kohler.npm-intellisense
        - christian-kohler.path-intellisense
        - dbaeumer.vscode-eslint
        - denoland.vscode-deno
        - dnut.rewrap-revived
        - docker.docker
        - dunstontc.viml
        - eamodio.gitlens
        - editorconfig.editorconfig
        - elijah-potter.harper
        - exodiusstudios.comment-anchors
        - github.github-vscode-theme
        - github.vscode-github-actions
        - gleam.gleam
        - golang.go
        - hashicorp.terraform
        - idleberg.applescript
        - idleberg.jxa
        - kumar-harsh.graphql-for-vscode
        # Syntax highlighting for Moon's Tera templates (.twig).
        - mblode.twig-language-2
        - mechatroner.rainbow-csv
        - mermaidchart.vscode-mermaid-chart
        - mgmcdermott.vscode-language-babel
        - mikestead.dotenv
        - mkhl.direnv
        - moonrepo.moon-console
        - ms-azuretools.vscode-containers
        - ms-azuretools.vscode-docker
        - ms-dotnettools.vscode-dotnet-runtime
        - ms-kubernetes-tools.vscode-kubernetes-tools
        - ms-playwright.playwright
        - ms-python.debugpy
        - ms-python.python
        # Inert in Cursor, which reinstalls it with the Python extension pack
        # and runs Anysphere's Pyright replacement instead.
        - ms-python.vscode-pylance
        - ms-python.vscode-python-envs
        - ms-toolsai.jupyter
        - ms-toolsai.jupyter-keymap
        - ms-toolsai.jupyter-renderers
        - ms-toolsai.vscode-jupyter-cell-tags
        - ms-toolsai.vscode-jupyter-slideshow
        - ms-vscode.atom-keybindings
        - ms-vscode.makefile-tools
        - nefrob.vscode-just-syntax
        - orta.vscode-jest
        - oven.bun-vscode
        - oxc.oxc-vscode
        - pflannery.vscode-versionlens
        - pkief.material-icon-theme
        - qwtel.sqlite-viewer
        - redhat.vscode-yaml
        - ritwickdey.liveserver
        - rust-lang.rust-analyzer
        - sleistner.vscode-fileutils
        - srshah.cosmic-gleam
        - streetsidesoftware.code-spell-checker
        - styled-components.vscode-styled-components
        - tamasfe.even-better-toml
        - tobermory.es6-string-html
        - tomoki1207.pdf
        - tyriar.sort-lines
        - unifiedjs.vscode-mdx
        - vadimcn.vscode-lldb
        - vscode-icons-team.vscode-icons
        - wmaurer.change-case
        - yoavbls.pretty-ts-errors
        - yzhang.markdown-all-in-one
      settings:
        "[dockercompose]":
          editor.autoIndent: advanced
          editor.defaultFormatter: redhat.vscode-yaml
          editor.insertSpaces: true
          editor.quickSuggestions:
            comments: false
            other: true
            strings: true
          editor.tabSize: 2
        "[elixir]":
          editor.bracketPairColorization.enabled: false
        "[github-actions-workflow]":
          editor.defaultFormatter: redhat.vscode-yaml
        "[gleam]":
          editor.defaultFormatter: gleam.gleam
        "[html]":
          editor.defaultFormatter: vscode.html-language-features
        "[javascript]":
          editor.defaultFormatter: oxc.oxc-vscode
        "[json]":
          editor.defaultFormatter: oxc.oxc-vscode
        "[markdown]":
          editor.defaultFormatter: oxc.oxc-vscode
        "[python]":
          editor.defaultFormatter: charliermarsh.ruff
          editor.tabSize: 4
        "[rust]":
          editor.defaultFormatter: rust-lang.rust-analyzer
        "[scss]":
          editor.defaultFormatter: oxc.oxc-vscode
        "[terraform-vars]":
          editor.defaultFormatter: hashicorp.terraform
        "[terraform]":
          editor.defaultFormatter: hashicorp.terraform
        "[typescript]":
          editor.defaultFormatter: oxc.oxc-vscode
        "[typescriptreact]":
          editor.defaultFormatter: oxc.oxc-vscode
        "[yaml]":
          editor.autoIndent: advanced
          editor.defaultFormatter: oxc.oxc-vscode
        # Projects can enable Biome through their editor settings.
        biome.enabled: false
        biome.suggestInstallingGlobally: false
        breadcrumbs.enabled: true
        cSpell.enabled: false
        cSpell.userWords:
          - initialised
          - pulumi
          - rustacean
        database-client.autoSync: true
        diffEditor.codeLens: true
        diffEditor.hideUnchangedRegions.enabled: true
        diffEditor.ignoreTrimWhitespace: false
        diffEditor.renderSideBySide: true
        docker.extension.enableComposeLanguageServer: false
        editor.defaultFormatter: oxc.oxc-vscode
        editor.fontFamily: "OverpassM Nerd Font Propo, Operator Mono, Menlo, Monaco, 'Courier New', monospace"
        editor.fontLigatures: true
        editor.fontSize: 13
        editor.formatOnPaste: true
        editor.formatOnSave: true
        editor.inlineSuggest.suppressSuggestions: true
        editor.minimap.enabled: false
        editor.minimap.renderCharacters: false
        editor.minimap.showSlider: always
        editor.multiCursorModifier: ctrlCmd
        editor.rulers:
          - 80
          - 100
        editor.semanticHighlighting.enabled: true
        editor.snippetSuggestions: top
        editor.stickyScroll.enabled: true
        editor.tabSize: 2
        editor.tokenColorCustomizations:
          textMateRules:
            - scope: punctuation.definition.comment
              settings:
                fontStyle: italic
                foreground: "#ff7bed"
            - scope: "comment, comment.line.double-slash"
              settings:
                fontStyle: italic
                foreground: "#ff7bed"
            - scope: heading.2.markdown entity.name.section.markdown
              settings:
                foreground: "#ff9421"
            - scope: heading.3.markdown entity.name.section.markdown
              settings:
                foreground: "#83d440"
            - scope: heading.4.markdown entity.name.section.markdown
              settings:
                foreground: "#00d5ff"
            - scope: markup.quote
              settings:
                foreground: "#60a66f"
        editor.wordWrap: "on"
        editor.wrappingIndent: deepIndent
        emmet.includeLanguages:
          javascript: javascriptreact
          typescript: typescriptreact
        emmet.syntaxProfiles:
          js:
            attr_quotes: single
          jsx:
            attr_quotes: single
          ts:
            attr_quotes: single
          tsx:
            attr_quotes: single
        emmet.triggerExpansionOnTab: true
        explorer.confirmDragAndDrop: false
        explorer.confirmPasteNative: false
        explorer.fileNesting.patterns:
          "*.db": "${capture}.${extname}-*"
          "*.db3": "${capture}.${extname}-*"
          "*.js": "${capture}.js.map, ${capture}.min.js, ${capture}.d.ts"
          "*.jsx": "${capture}.js"
          "*.s3db": "${capture}.${extname}-*"
          "*.sdb": "${capture}.${extname}-*"
          "*.sqlite": "${capture}.${extname}-*"
          "*.sqlite3": "${capture}.${extname}-*"
          "*.ts": "${capture}.js"
          "*.tsx": "${capture}.ts"
          Cargo.toml: Cargo.lock
          package.json: "package-lock.json, yarn.lock, pnpm-lock.yaml, bun.lockb, bun.lock"
          tsconfig.json: "tsconfig.*.json"
        explorer.openEditors.visible: 1
        files.associations:
          "**/.github/**/*.yml": github-actions-workflow
          "*.mdx": mdx
        files.insertFinalNewline: true
        files.trimFinalNewlines: true
        files.trimTrailingWhitespace: true
        git.allowForcePush: true
        git.confirmForcePush: false
        git.confirmSync: false
        git.rebaseWhenSync: true
        gitlens.graph.details.location: auto
        gitlens.views.commitDetails.files.layout: tree
        harper.dialect: British
        html.format.wrapLineLength: 90
        js/ts.tsdk.path: "./node_modules/typescript/lib"
        js/ts.updateImportsOnFileMove.enabled: always
        js/ts.validate.enabled: true
        json.schemaDownload.trustedDomains:
          "https://biomejs.dev": true
          "https://developer.microsoft.com/json-schemas/": true
          "https://json-schema.org/": true
          "https://json.schemastore.org/": true
          "https://raw.githubusercontent.com/": true
          "https://raw.githubusercontent.com/devcontainers/spec/": true
          "https://raw.githubusercontent.com/microsoft/vscode/": true
          "https://schemastore.azurewebsites.net/": true
          "https://www.schemastore.org/": true
        jupyter.interactiveWindow.creationMode: perFile
        jupyter.interactiveWindow.textEditor.executeSelection: true
        jupyter.widgetScriptSources:
          - jsdelivr.com
          - unpkg.com
        liveServer.settings.donotShowInfoMsg: true
        makefile.configureOnOpen: true
        notebook.stickyScroll.enabled: true
        npm.enableRunFromFolder: true
        # Projects can enable Oxc through their editor settings.
        oxc.enable: false
        redhat.telemetry.enabled: false
        security.promptForLocalFileProtocolHandling: false
        security.workspace.trust.untrustedFiles: open
        terminal.external.osxExec: iTerm.app
        terminal.integrated.inheritEnv: false
        testing.resultsView.layout: treeLeft
        twig-language-2.formatting: false
        window.restoreWindows: all
        window.zoomLevel: 1
        workbench.colorCustomizations:
          editorCodeLens.foreground: "#787776e6"
          editorCursor.foreground: "#00ff40"
          notebook.cellBorderColor: "#111"
          notebook.editorBackground: "#232629"
          notebook.focusedCellBackground: "#232629"
          notebook.focusedCellBorder: "#ff9500"
          notebook.outputContainerBackgroundColor: "#16181a"
          notebook.selectedCellBackground: "#232629"
        workbench.editor.closeOnFileDelete: false
        workbench.editor.highlightModifiedTabs: true
        workbench.editor.tabSizing: shrink
        workbench.editorAssociations:
          "*.db": sqlite-viewer.option
        workbench.enableExperiments: false
        workbench.startupEditor: newUntitledFile
        workbench.tree.stickyScrollMaxItemCount: 5
        yaml.disableSchemaDetection:
          - "**/.github/workflows/*.yml"
          - "**/.github/workflows/*.yaml"
          - "**/.gitea/workflows/*.yml"
          - "**/.gitea/workflows/*.yaml"
          - "**/.forgejo/workflows/*.yml"
          - "**/.forgejo/workflows/*.yaml"
        zenMode.centerLayout: false
        zenMode.fullScreen: false
        zenMode.hideLineNumbers: false
    profiles:
      personal:
        extensions: []
      work:
        extensions:
          - stylelint.vscode-stylelint
          # Not published to Open VSX; Cursor needs the Microsoft gallery URL.
          - typescriptteam.native-preview
    code:
      extensions:
        - anthropic.claude-code
        - openai.chatgpt
        # Not published to Open VSX, so Cursor cannot install these.
        - arsen.darcula-theme-for-elixir
        - asvetliakov.snapshot-tools
        - azemoh.one-monokai
        - cweijan.vscode-postgresql-client2
        - jaimeolivares.yuml
        - jakebecker.elixir-ls
        - lunaryorn.fish-ide
        - mingteo.sort-selection-concentrically
        - ms-toolsai.datawrangler
        - sidneys1.gitconfig
        - simonsiefke.svg-preview
        - skyapps.fish-vscode
        - tanvir.ollama-modelfile
      settings:
        "[elixir]":
          editor.defaultFormatter: JakeBecker.elixir-ls
        "[sql]":
          editor.defaultFormatter: cweijan.vscode-postgresql-client2
        chat.agent.enabled: true
        chat.disableAIFeatures: true
        claudeCode.hideOnboarding: true
        extensions.ignoreRecommendations: false
        files.associations:
          Modelfile: modelfile
        python.analysis.typeCheckingMode: standard
        svgPreview.autoOpen: false
        workbench.activityBar.location: top
        workbench.colorTheme: One Monokai
        workbench.iconTheme: material-icon-theme
    cursor:
      extensions:
        - anysphere.cursorpyright
        - anysphere.remote-containers
        - anysphere.remote-ssh
        - cweijan.vscode-database-client2
        - elixir-lsp.elixir-ls
        - jcalvillo.ollama-modelfile-syntax
        - matt17br.openwrangler
        - ndonfris.fish-lsp
        - zascal.css-sorter
      settings:
        "[elixir]":
          editor.defaultFormatter: elixir-lsp.elixir-ls
        "[go]":
          editor.defaultFormatter: golang.go
          editor.insertSpaces: true
        "[sql]":
          editor.defaultFormatter: cweijan.vscode-database-client2
        commentAnchors.tags.anchors:
          WARNING:
            highlightColor: "#FF8F00"
            scope: workspace
        cursor.composer.codeBlockWordWrap: true
        cursor.composer.queueMessageDefaultBehavior: steer
        cursorpyright.analysis.typeCheckingMode: standard
        editor.codeActions.triggerOnFocusChange: true
        editor.detectIndentation: false
        editor.indentSize: tabSize
        explorer.confirmDelete: false
        extensions.ignoreRecommendations: true
        files.associations:
          "*.{pipe,datasource,incl}": sql
        go.diagnostic.vulncheck: Imports
        go.toolsManagement.autoUpdate: true
        jest.runMode: on-demand
        js/ts.experimental.useTsgo: false
        # Projects can opt in by enabling the formatter and linter individually.
        oxc.enable.oxfmt: false
        oxc.enable.oxlint: false
        window.autoDetectColorScheme: false
        window.title: "${rootPath}${separator}${profileName}${separator}${activeRepositoryBranchName}"
        workbench.colorTheme: Default Dark Modern
        workbench.editor.showTabs: multiple
        workbench.iconTheme: vscode-icons
      # Preserve these keys from the current machine's Cursor settings.
      machine_settings:
        - direnv.path.executable
        - extensions.gallery.serviceUrl
        - extensions.installCooldownHours
        - python.defaultInterpreterPath
        - typescript.tsserver.nodePath
      extra_textmate_rules:
        - scope: markup.bold
          settings:
            fontStyle: ""
            foreground: "#e4a1af"
        - scope: markup.italic
          settings:
            fontStyle: ""
            foreground: "#77a1bd"
  zed:
    extensions:
      - andromeda
      - catppuccin
      - catppuccin-icons
      - dracula
      - elixir
      - fish
      - git-firefly
      - html
      - just
      - latex
      - log
      - oxc
      - sql
      - toml
      - xml
