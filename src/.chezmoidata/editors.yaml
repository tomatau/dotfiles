  zed_extensions:
    - andromeda
    - catppuccin
    - catppuccin-icons
    - dracula
    - elixir
    - fish
    - git-firefly
    - html
    - just
    - latex
    - log
    - oxc
    - sql
    - toml
    - xml
  code:
    extensions:
      additional:
        - anthropic.claude-code
        - openai.chatgpt
        # Cursor uses Anysphere's Pyright replacement for Pylance.
        - ms-python.vscode-pylance
        - ms-python.vscode-python-envs
        # Not published to Open VSX, so Cursor cannot install these.
        - arsen.darcula-theme-for-elixir
        - asvetliakov.snapshot-tools
        - azemoh.one-monokai
        - cweijan.vscode-postgresql-client2
        - geeebe.duplicate
        - jaimeolivares.yuml
        - jakebecker.elixir-ls
        - jonasgruenwald.code-livebook
        - lunaryorn.fish-ide
        - mingteo.sort-selection-concentrically
        - ms-toolsai.datawrangler
        - sidneys1.gitconfig
        - simonsiefke.svg-preview
        - skyapps.fish-vscode
        - tanvir.ollama-modelfile
        - travisthetechie.write-good-linter
  cursor:
    # VS Code is the settings baseline; these are Cursor's exceptions.
    unset_settings:
      - chat.agent.enabled
      - chat.disableAIFeatures
      - claudeCode.hideOnboarding
      - python.analysis.typeCheckingMode
      - workbench.activityBar.location
    # Kept as this machine has them; never written by the dotfiles.
    machine_settings:
      - direnv.path.executable
      - extensions.gallery.serviceUrl
      - extensions.installCooldownHours
      - python.defaultInterpreterPath
      - typescript.tsserver.nodePath
    settings:
      '[go]':
        editor.defaultFormatter: golang.go
        editor.insertSpaces: true
      biome.enabled: false
      biome.suggestInstallingGlobally: false
      commentAnchors.tags.list:
        - tag: TODO
          iconColor: blue
          highlightColor: '#3ea8ff'
          scope: workspace
        - tag: FIXME
          iconColor: red
          highlightColor: '#F44336'
          scope: workspace
        - tag: STUB
          iconColor: purple
          highlightColor: '#BA68C8'
          scope: file
        - tag: NOTE
          iconColor: orange
          highlightColor: '#FFB300'
          scope: file
        - tag: REVIEW
          iconColor: green
          highlightColor: '#64DD17'
          scope: workspace
      cursor.composer.codeBlockWordWrap: true
      cursor.composer.queueMessageDefaultBehavior: steer
      cursorpyright.analysis.typeCheckingMode: standard
      editor.codeActions.triggerOnFocusChange: true
      editor.detectIndentation: false
      editor.indentSize: tabSize
      explorer.confirmDelete: false
      extensions.ignoreRecommendations: true
      files.associations:
        '**/.github/**/*.yml': github-actions-workflow
        '*.mdx': mdx
        '*.{pipe,datasource,incl}': sql
        Modelfile: modelfile
      go.diagnostic.vulncheck: Imports
      go.toolsManagement.autoUpdate: true
      jest.runMode: on-demand
      js/ts.experimental.useTsgo: false
      makefile.configureOnOpen: true
      oxc.enable.oxfmt: false
      oxc.enable.oxlint: false
      window.autoDetectColorScheme: false
      window.title: '${rootPath}${separator}${profileName}${separator}${activeRepositoryBranchName}'
      workbench.colorTheme: Default Dark Modern
      workbench.editor.showTabs: multiple
      workbench.iconTheme: vscode-icons
    extra_textmate_rules:
      - scope: markup.bold
        settings:
          fontStyle: ''
          foreground: '#e4a1af'
      - scope: markup.italic
        settings:
          fontStyle: ''
          foreground: '#77a1bd'
    extensions:
      additional:
        - anysphere.cursorpyright
        - anysphere.remote-containers
        - anysphere.remote-ssh
