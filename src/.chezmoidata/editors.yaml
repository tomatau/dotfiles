  code:
    extensions:
      additional:
        - anthropic.claude-code
        - openai.chatgpt
        # Cursor uses Anysphere's Pyright replacement for Pylance.
        - ms-python.vscode-pylance
        - ms-python.vscode-python-envs
  cursor:
    # VS Code is the settings baseline; these are Cursor's exceptions.
    unset_settings:
      - chat.agent.enabled
      - chat.disableAIFeatures
      - claudeCode.hideOnboarding
      - python.analysis.typeCheckingMode
      - workbench.activityBar.location
    settings:
      cursor.composer.codeBlockWordWrap: true
      cursor.composer.queueMessageDefaultBehavior: stop-and-send
      cursorpyright.analysis.typeCheckingMode: standard
      explorer.confirmDelete: false
      extensions.ignoreRecommendations: true
      go.diagnostic.vulncheck: Imports
      window.autoDetectColorScheme: false
      window.titleBarStyle: native
      workbench.colorTheme: GitHub Dark
      workbench.editor.editorActionsLocation: titleBar
      workbench.editor.showTabs: multiple
      workbench.iconTheme: vscode-icons
      workbench.secondarySideBar.showLabels: false
      workbench.sideBar.location: right
    extra_textmate_rules:
      - scope: markup.bold
        settings:
          fontStyle: ''
          foreground: '#e4a1af'
      - scope: markup.italic
        settings:
          fontStyle: ''
          foreground: '#77a1bd'
    extensions:
      additional:
        - anysphere.cursorpyright
        - anysphere.remote-containers
        - anysphere.remote-ssh
